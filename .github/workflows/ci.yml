name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff mypy
      - run: ruff check --fix . && ruff check .
      - run: python -m pytest project-1-migration/python-sample/tests -q
      - run: python -m pytest project-2-coldstart/python/tests -q
      - run: python -m pytest project-3-test-swarm/python/tests -q
      - run: python -m pytest project-4-polyglot/tests -q
      - run: python -m pytest project-5-docs-to-code/tests -q
      - run: python -m pytest project-6-bughunt/python/tests -q
      - run: python -m pytest project-8-strict-typing/tests -q
      - run: python -m pytest project-9-traffic-sdk/tests -q
      - run: python -m pytest project-10-upgrade/tests -q
      - run: python project-11-log-dashboard/gen_logs.py && python project-11-log-dashboard/analyze.py
      - run: python -m pytest project-11-log-dashboard/tests -q
      - run: python -m pytest project-12-config-drift/tests -q
      - run: python -m pytest project-13-deadcode/tests -q
      - run: python -m pytest project-14-fuzz/tests -q
      - run: python -m pytest project-15-i18n/tests -q
      - run: python project-16-rehearsal/rehearse.py
      - run: python -m pytest project-16-rehearsal/tests -q
      - run: python project-17-perf/bench.py && python project-17-perf/gate.py --update-baseline && python project-17-perf/trend.py
      - run: python -m pytest project-17-perf/tests -q
      - run: mypy project-8-strict-typing/app
      - run: python project-5-docs-to-code/gen/generate.py && git diff --exit-code -- project-5-docs-to-code/out
      - run: python project-9-traffic-sdk/gen/build_sdk.py && git diff --exit-code -- project-9-traffic-sdk/out

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node project-1-migration/js-sample/test/test-legacy.cjs
      - run: node --test project-1-migration/js-sample/test/test-migrated.test.mjs
      - run: node --test project-2-coldstart/js/test/tags.test.mjs
      - run: node project-3-test-swarm/js/test/test-weak.mjs
      - run: node --test project-3-test-swarm/js/test/test-full.test.mjs
      - run: sh project-4-polyglot/e2e/check.sh
      - run: node project-6-bughunt/js/repro/repro.mjs
      - run: node --test project-6-bughunt/js/test/regress.test.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t muse-projects .
